id: T7-qq-latest
title: QQ：置顶会话最新 3 条消息
app: QQ
# QQ in the VM base, logged in as a test account (bench/vm/qq/README.md). No conversation is open at the start: the
# model has to click the pinned conversation first. Messages were sent once from the maintainer's other account
# following bench/vm/qq/messages.md; expect = that script. Nicknames are deliberately not in any prompt.
modes: [real]
# Read only (2026-10-02): the daemon grant allows only these actions; cu_type / cu_key / cu_set_value are neither offered
# nor executable (action_not_allowed, retry never), and run_e2e.py refuses a QQ task without this list.
actions: [observe, zoom, read_text, click, scroll]
# Left single clicks only (daemon click_limit): no double click (QQ pokes on a double-clicked avatar), no right-click
# menu (delete chat). All three tasks need just one left click on the pinned conversation.
click_limit: {buttons: [left], max_count: 1}
# Ready = ready_text on screen AND no popup (QQ syncs with its server on every clone start: new-device, update and
# security notices differ run to run). A popup = environment failure, not in the model's score. popup_text and
# max_windows: confirm on site against the clean base (no false positive) before T7 runs.
setup:
  # The pinned conversation's last-message preview in the list ("…老地方见…"): the list has synced. QQNT's left bar is
  # icons only, so "消息" never appears as text (checked on site 2026-10-02).
  ready_text: 老地方
  ready_timeout_s: 120
  settle_s: 3
  popup_check: true
  max_windows: 1
  popup_text: [版本更新, 新版本, 立即更新, 立即升级, 安全提醒, 新设备, 异地登录, 登录保护, 身份验证, 重新登录, 下线通知, 稍后提醒]
prompt: |
  QQ 里有一个置顶的私聊会话。打开它，按从旧到新的顺序读出最新的 3 条消息的正文（不含发送者和时间）。只读，不要发送任何消息。
answer: '{"messages": ["...", "...", "..."]}'
expect:
  messages:
    - 取件码 Il1O0-5S8B，放在 3 号柜。
    - 好的👍 收到🎉
    - 晚上 7 点老地方见，记得带伞☔
match: cer_list
cer_threshold: 0.1
# Content only: the time shown changes with the date ("10:05" today, "昨天 10:05" tomorrow); removed before scoring.
strip_time: true
# Emoji: QQ may draw a phone's emoji as its own face image; AX may then read "[微笑]"-style text and OCR nothing.
# Checked on site 2026-10-02: AX (electron_ax on) reads the exact Unicode emoji (U+1F44D, U+1F389, U+2614), no
# "[微笑]"-style text; OCR reads 👍 as 小 and drops the others. So Unicode only.
equivalents: []
