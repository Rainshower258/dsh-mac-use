# Fixture content: the single source of truth for every bench screenshot and
# E2E task. The fixture app lays this out identically in dom / canvas / image
# modes, so ground truth is the same text regardless of how pixels are made.
#
# Message fields:
#   id          stable id, referenced by tasks (e.g. c3m3)
#   from        sender display name; `self` marks the local user (right bubble)
#   time        timestamp shown above the bubble
#   text        message text; newlines are hard breaks, long lines soft-wrap
#   kind        text (default) | code (monospace) | image (text baked into a
#               picture in EVERY mode — "字在图片里")
#   style       optional list: small (11px) | faint (low-contrast grey)
#   keystrings  exact strings an agent must reproduce character-for-character

